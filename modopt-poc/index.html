<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GuionBot mod optimizer — browser POC</title>
  </head>
  <body>
    <main>
      <h1>Browser mod optimizer — step 1</h1>
      <p>
        Select a Grandivory “Save my progress” JSON file. This step only reads
        the file locally and summarizes its structure; it does not upload the
        file or run the optimizer.
      </p>
      <label for="progress-file">Progress file (JSON)</label>
      <input id="progress-file" type="file" accept=".json,application/json" />
      <p id="file-status" role="status" aria-live="polite">Choose a progress file to inspect it.</p>
      <section id="summary" hidden>
        <h2>Inventory summary</h2>
        <dl id="summary-fields"></dl>
        <h2>Detected structure</h2>
        <pre id="structure"></pre>
      </section>
      <pre id="error" role="alert" hidden></pre>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
